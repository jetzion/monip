<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Searching">
  <style>
    .orbit { transform-origin: 50px 50px; animation: spin 1.6s linear infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.6); opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .dot { animation-duration: 4s; }
    }
  </style>
  <!-- Dots shrink and fade from deep blue to white, forming a comet-like trail -->
  <g class="orbit">
    <circle class="dot" cx="50"   cy="12"   r="9"   fill="#0B3D91" style="animation-delay:0s"/>
    <circle class="dot" cx="76.9" cy="23.1" r="8"   fill="#1565C0" style="animation-delay:-0.2s"/>
    <circle class="dot" cx="88"   cy="50"   r="7"   fill="#1E88E5" style="animation-delay:-0.4s"/>
    <circle class="dot" cx="76.9" cy="76.9" r="6"   fill="#42A5F5" style="animation-delay:-0.6s"/>
    <circle class="dot" cx="50"   cy="88"   r="5"   fill="#64B5F6" style="animation-delay:-0.8s"/>
    <circle class="dot" cx="23.1" cy="76.9" r="4"   fill="#90CAF9" style="animation-delay:-1.0s"/>
    <circle class="dot" cx="12"   cy="50"   r="3.2" fill="#BBDEFB" style="animation-delay:-1.2s"/>
    <circle class="dot" cx="23.1" cy="23.1" r="2.5" fill="#FFFFFF" style="animation-delay:-1.4s"/>
  </g>
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="600" fill="#1E88E5">Search</text>
</svg>
